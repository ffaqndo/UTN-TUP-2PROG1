<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title> Registro </title>
    </head>

    <body>
        <header>
            <h1> Registro de Usuario </h1>
        </header>
        <section>
            <form>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Carlos Perez" required>
                <br><br>

                <label for="correo">Correo electronico:</label>
                <input type="email" id="correo" name="correo" placeholder="correoejemplo@gmail.com"required>
                <br><br>

                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="********" required>
                <br><br>

                <p>Seleccion de genero:</p>
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label>

                <input type="radio" id="femenino" name="genero" value="femenino">
                <label for="femenino">Femenino</label>

                <input type="radio" id="otro" name="genero" value="otro">
                <label for ="otro">Otro</label>
                <br><br>

                <p>Intereses:</p>
                <input type="radio" id="musica" name="intereses" value="musica">
                <label for="musica">Musica</label>
                <br><br>

                <input type="radio" id="deportes" name="intereses" value="deportes">
                <label for="deportes">Deportes</label>
                <br><br>

                <input type="radio" id="lectura" name="intereses" value="lectura">
                <label for="lectura">Lectura</label>
                <br><br>

                <label for="comentarios">Informacion Adicional</label>
                <textarea id="comentarios" name="comentarios" placeholder="Ingrese el texto aqui"></textarea>
                <br><br>

                <label for="pais">Pais:</label>
                <select id="pais" name="pais">
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                </select>
                <br><br>

                <input type="submit" value="Enviar Registro">
            </form>
        </section>
    </body>


</html>
